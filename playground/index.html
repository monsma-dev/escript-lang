<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EScript Playground — Evolution Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'evolution-dark': '#1e293b',
                        'evolution-darker': '#0f172a',
                        'evolution-border': '#334155',
                        'evolution-accent': '#3b82f6',
                        'evolution-success': '#10b981',
                        'evolution-warning': '#f59e0b',
                        'evolution-danger': '#ef4444',
                        'evolution-muted': '#94a3b8',
                    }
                }
            }
        }
    </script>
    <style>
        .editor-font { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #9ca3af; }
        .tab-inactive:hover { color: #d1d5db; }
        textarea { tab-size: 4; }
        .keyword { color: #c084fc; }
        .annotation { color: #f59e0b; }
        .string-lit { color: #34d399; }
        .type-name { color: #60a5fa; }
        .comment { color: #6b7280; font-style: italic; }
        .marketplace-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .glass-effect {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .pill-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="h-full bg-evolution-darker text-gray-100">

<div id="app" class="h-full flex flex-col">
    <!-- Top Navigation (Marketplace style) -->
    <header class="glass-effect border-b border-evolution-border">
        <div class="flex items-center justify-between px-6 py-3">
            <!-- Left side -->
            <div class="flex items-center gap-4">
                <!-- Heel Europa style pill -->
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-evolution-accent/20 border border-evolution-accent/50 pill-glow">
                    <svg class="w-4 h-4 text-evolution-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span class="text-evolution-accent font-medium">EScript</span>
                </div>
                
                <div class="flex items-center gap-1">
                    <h1 class="text-xl font-bold text-white">Playground</h1>
                    <span class="px-2 py-0.5 rounded-full bg-evolution-success/20 text-evolution-success text-xs font-medium">Live</span>
                </div>
            </div>

            <!-- Right side -->
            <div class="flex items-center gap-4">
                <!-- Example selector (marketplace dropdown style) -->
                <div class="relative">
                    <select id="exampleSelect" class="appearance-none bg-evolution-dark border border-evolution-border rounded-lg px-4 py-2 pr-8 text-sm text-gray-200 focus:outline-none focus:ring-2 focus:ring-evolution-accent/50 focus:border-evolution-accent">
                        <option value="basic-api">Basic REST API</option>
                        <option value="compliance">Compliance Automation</option>
                        <option value="custom">Custom</option>
                    </select>
                    <svg class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 text-evolution-muted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </div>

                <!-- Compile button (marketplace CTA style) -->
                <button id="compileBtn" class="bg-evolution-accent hover:bg-evolution-accent/90 text-white px-6 py-2 rounded-lg font-medium transition-all duration-200 flex items-center gap-2 shadow-lg hover:shadow-xl">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Compile
                </button>

                <!-- GitHub link -->
                <a href="https://github.com/monsma-dev/escript-lang" target="_blank" class="text-evolution-muted hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex min-h-0">
        <!-- Editor Panel -->
        <div class="w-1/2 flex flex-col border-r border-evolution-border">
            <!-- Editor header -->
            <div class="glass-effect px-4 py-2 border-b border-evolution-border">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-evolution-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span class="text-sm font-medium text-gray-200">source.es</span>
                        <span id="lineCount" class="text-xs text-evolution-muted">0 lines</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-evolution-muted">EScript v0.1.0</span>
                    </div>
                </div>
            </div>
            
            <!-- Editor -->
            <textarea
                id="editor"
                class="flex-1 bg-evolution-dark text-gray-100 p-4 resize-none focus:outline-none editor-font text-sm leading-relaxed"
                spellcheck="false"
                placeholder="Write your EScript code here..."
            ></textarea>
            
            <!-- Lint bar -->
            <div id="lintBar" class="glass-effect px-4 py-2 border-t border-evolution-border flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="lintIcon" class="text-evolution-success">●</span>
                    <span id="lintStatus" class="text-gray-300 text-sm">No issues</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="compileTime" class="text-xs text-evolution-muted"></span>
                </div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="w-1/2 flex flex-col">
            <!-- Output tabs -->
            <div class="glass-effect border-b border-evolution-border">
                <div class="flex">
                    <button class="output-tab tab-active px-4 py-2 text-xs font-medium" data-tab="ir">IR Output</button>
                    <button class="output-tab tab-inactive px-4 py-2 text-xs font-medium" data-tab="errors">Errors</button>
                    <button class="output-tab tab-inactive px-4 py-2 text-xs font-medium" data-tab="ast">AST</button>
                    <button class="output-tab tab-inactive px-4 py-2 text-xs font-medium" data-tab="tokens">Tokens</button>
                    <button class="output-tab tab-inactive px-4 py-2 text-xs font-medium" data-tab="dashboard">
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                            Dashboard
                        </span>
                    </button>
                </div>
            </div>
            <!-- Output panels -->
            <div id="output-ir" class="output-panel flex-1 overflow-auto p-4">
                <pre id="irOutput" class="editor-font text-sm text-gray-200 whitespace-pre-wrap">Click "Compile" to see the IR output.</pre>
            </div>
            <div id="output-errors" class="output-panel flex-1 overflow-auto p-4 hidden">
                <pre id="errorsOutput" class="editor-font text-sm text-red-400 whitespace-pre-wrap">No errors.</pre>
            </div>
            <div id="output-ast" class="output-panel flex-1 overflow-auto p-4 hidden">
                <pre id="astOutput" class="editor-font text-sm text-gray-200 whitespace-pre-wrap">Click "Compile" to see the AST.</pre>
            </div>
            <div id="output-tokens" class="output-panel flex-1 overflow-auto p-4 hidden">
                <pre id="tokensOutput" class="editor-font text-sm text-gray-200 whitespace-pre-wrap">Click "Compile" to see the tokens.</pre>
            </div>
            <div id="output-dashboard" class="output-panel flex-1 overflow-auto p-4 hidden">
                <div id="dashboardContent" class="space-y-4">
                    <p class="text-gray-400 text-sm">Compile to see compliance dashboard.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <footer class="glass-effect border-t border-evolution-border px-4 py-2">
        <div class="flex items-center justify-between text-xs text-evolution-muted">
            <div class="flex items-center gap-4">
                <span id="status">Ready</span>
                <span class="flex items-center gap-1">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    Evolution Framework
                </span>
            </div>
            <div class="flex items-center gap-4">
                <span>Powered by EScript</span>
            </div>
        </div>
    </footer>
</div>

<script src="compiler.js"></script>
<script src="app.js"></script>
</body>
</html>
