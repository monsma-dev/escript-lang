<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EScript Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .editor-font { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #9ca3af; }
        .tab-inactive:hover { color: #d1d5db; }
        textarea { tab-size: 4; }
        .keyword { color: #c084fc; }
        .annotation { color: #f59e0b; }
        .string-lit { color: #34d399; }
        .type-name { color: #60a5fa; }
        .comment { color: #6b7280; font-style: italic; }
    </style>
</head>
<body class="h-full bg-gray-950 text-gray-100">

<div id="app" class="h-full flex flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-3 bg-gray-900 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold">
                <span class="text-blue-400">E</span>Script
                <span class="text-gray-500 font-normal text-sm ml-1">Playground</span>
            </h1>
            <span class="text-xs px-2 py-0.5 rounded bg-amber-900/40 text-amber-400 border border-amber-800">v0.1.0</span>
        </div>
        <div class="flex items-center gap-3">
            <select id="exampleSelect" class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm text-gray-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <option value="basic-api">Basic REST API</option>
                <option value="compliance">Compliance Automation</option>
                <option value="custom">Custom</option>
            </select>
            <button id="compileBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-sm font-medium transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Compile
            </button>
        </div>
    </header>

    <!-- Main -->
    <div class="flex-1 flex min-h-0">
        <!-- Editor Panel -->
        <div class="w-1/2 flex flex-col border-r border-gray-800">
            <div class="px-4 py-2 bg-gray-900/50 border-b border-gray-800 text-xs text-gray-500 flex items-center justify-between">
                <span>source.es</span>
                <span id="lineCount" class="text-gray-600">0 lines</span>
            </div>
            <textarea
                id="editor"
                class="flex-1 bg-gray-950 text-gray-200 p-4 resize-none focus:outline-none editor-font text-sm leading-relaxed"
                spellcheck="false"
                placeholder="Write your EScript code here..."
            ></textarea>
        </div>

        <!-- Output Panel -->
        <div class="w-1/2 flex flex-col">
            <div class="flex border-b border-gray-800 bg-gray-900/50">
                <button class="output-tab tab-active px-4 py-2 text-xs" data-tab="ir">IR Output</button>
                <button class="output-tab tab-inactive px-4 py-2 text-xs" data-tab="errors">Errors</button>
                <button class="output-tab tab-inactive px-4 py-2 text-xs" data-tab="ast">AST</button>
                <button class="output-tab tab-inactive px-4 py-2 text-xs" data-tab="tokens">Tokens</button>
            </div>
            <div id="output-ir" class="output-panel flex-1 overflow-auto p-4">
                <pre id="irOutput" class="editor-font text-sm text-gray-300 whitespace-pre-wrap">Click "Compile" to see the IR output.</pre>
            </div>
            <div id="output-errors" class="output-panel flex-1 overflow-auto p-4 hidden">
                <pre id="errorsOutput" class="editor-font text-sm text-red-400 whitespace-pre-wrap">No errors.</pre>
            </div>
            <div id="output-ast" class="output-panel flex-1 overflow-auto p-4 hidden">
                <pre id="astOutput" class="editor-font text-sm text-gray-300 whitespace-pre-wrap">Click "Compile" to see the AST.</pre>
            </div>
            <div id="output-tokens" class="output-panel flex-1 overflow-auto p-4 hidden">
                <pre id="tokensOutput" class="editor-font text-sm text-gray-300 whitespace-pre-wrap">Click "Compile" to see the tokens.</pre>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <footer class="flex items-center justify-between px-4 py-1.5 bg-gray-900 border-t border-gray-800 text-xs text-gray-500">
        <div class="flex items-center gap-4">
            <span id="status">Ready</span>
            <span id="compileTime"></span>
        </div>
        <div class="flex items-center gap-4">
            <span>EScript v0.1.0</span>
            <a href="https://github.com/monsma-dev/escript-lang" target="_blank" class="text-gray-400 hover:text-blue-400 transition-colors">GitHub</a>
        </div>
    </footer>
</div>

<script src="compiler.js"></script>
<script src="app.js"></script>
</body>
</html>
