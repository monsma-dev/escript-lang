name: Deploy EScript Playground to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'playground/**', 'content/blog/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'playground/**', 'content/blog/**' ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
      with:
        # Automatically enable Pages if not already enabled
        enablement: true
    
    - name: Build artifact
      run: |
        mkdir -p dist
        cp -r playground/* dist/
        mkdir -p dist/blog
        cp -r content/blog/* dist/blog/
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
